  to = "/.netlify/functions/webinar-join"
  status = 200
  force = true

# FWN pages are unlisted. noindex is also set in each page's meta robots.
[[headers]]
  for = "/fwn-webinar"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fwn-webinar.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fwn/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# FORGE webinar checkout pages are unlisted. noindex is also set in each page.
[[headers]]
  for = "/webinar/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[functions.fwn-checkout]
  timeout = 26

[functions.fwn-stripe-webhook]
  timeout = 26

[functions.webinar-checkout]
  timeout = 26

[functions.webinar-register]
  timeout = 26

[functions.webinar-join]
  timeout = 10

# Forced 404s for source and other non-web files. These rules are below
# every /api/* rewrite. A splat matches only at the end of a segment, so
# /netlify/* does not match /.netlify/functions/* (the function path has a
# leading dot) and does not match /api/*. *.sql and *.md cannot be one
# splat, so each file outside a blocked directory is listed exactly.
# scripts/publish-site.js also leaves these files out of public/.
# No markdown file is linked from a page, so none is exempt.
[[redirects]]
  from = "/netlify"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
