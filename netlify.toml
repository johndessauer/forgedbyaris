[functions]
  directory = "netlify/functions"
  # Comping engine fixtures are read with fs at runtime (mock/demo mode),
  # so they must be shipped with the function bundle explicitly.
  included_files = ["netlify/functions/__fixtures__/**"]

[functions.aris-quote]
  timeout = 26

# Comping engine: three RentCast calls run in parallel (8s timeout each,
# one retry). 26s, as aris-quote already uses, leaves room for a retry.
[functions.rentcast-comps]
  timeout = 26

[[redirects]]
  from = "/api/aris-quote"
  to = "/.netlify/functions/aris-quote"
  status = 200

