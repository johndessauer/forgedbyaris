# FWN pages are unlisted. noindex is also set in each page's meta robots.
[[headers]]
  for = "/fwn-webinar"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fwn-webinar.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fwn/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# FORGE webinar checkout pages are unlisted. noindex is also set in each page.
[[headers]]
  for = "/webinar/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[functions.fwn-checkout]
  timeout = 26

[functions.fwn-stripe-webhook]
  timeout = 26

[functions.webinar-checkout]
  timeout = 26

# Internal handoff notes live in docs/handoffs/ (Comping Engine Build Brief
# §10). The site publishes the repo root, so block them from the web.
[[redirects]]
  from = "/docs/handoffs/*"
  to = "/404.html"
  status = 404
  force = true

# Short path for the Chris/Eddie/Ian FWN book-a-call round-robin.
# Same widget as DEMO_URL in assets/site.js. 302 (not a rewrite) so the
# browser lands on the LeadConnector widget. No query key is set here, so
# Netlify forwards the request query string (for example ?ref=blog).
# Trailing-slash normalization matches /book and /book/.
[[redirects]]
  from = "/book"
  to = "https://api.leadconnectorhq.com/widget/booking/JlM6SoqbqCKmDois6PHx"
  status = 302
  force = true

# FWN index. The FWN pages live under /fwn/ (997, 1797, accelerator, launch,
# thank-you, 4-numbers-deal-sheet.pdf) but there is no /fwn/index.html, so
# /fwn and /fwn/ returned 404. Send them to the FWN webinar landing page.
# Only the exact index path matches; /fwn/* pages are untouched.
[[redirects]]
  from = "/fwn"
  to = "/fwn-webinar"
  status = 302
  force = true

[[redirects]]
  from = "/fwn/"
  to = "/fwn-webinar"
  status = 302
  force = true
