<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real Estate Lab | FORGE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --navy:       #0D1B2A;
  --navy-light: #13233a;
  --navy-mid:   #1a3350;
  --orange:     #FF6B2B;
  --orange-dim: rgba(255,107,43,0.12);
  --gold:       #C89B3C;
  --gold-dim:   rgba(200,155,60,0.15);
  --white:      #FFFFFF;
  --grey:       #6B7280;
  --grey-light: #9CA3AF;
  --border-sub: rgba(255,255,255,0.08);
  --red:        #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--navy); color: var(--white); font-family: 'Inter', sans-serif; height: 100%; overflow: visible; }
html { height: 100%; }
.app { display: flex; min-height: 100vh; width: 100%; }

/* ── SIDEBAR (follow-up pass will add "Real Estate Lab" nav link across every other page) ── */
.sidebar { width: 220px; background: var(--navy-light); border-right: 1px solid var(--border-sub); padding: 20px 14px; flex-shrink: 0; display: flex; flex-direction: column; }
.logo-row { display: flex; align-items: center; gap: 8px; padding: 0 6px 20px; }
.logo-icon { width: 28px; height: 28px; }
.logo-words .wordmark { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--white); }
.logo-words .wordmark span { color: var(--gold); }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--grey-light); transition: background 0.15s, color 0.15s; text-decoration: none; user-select: none; }
.nav-item.active { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(255,107,43,0.2); }
.nav-item:hover:not(.active) { background: var(--navy-mid); color: var(--white); }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: visible; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--border-sub); flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-icon { font-size: 22px; }
.topbar-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; }
.topbar-sub { font-size: 11px; color: var(--grey); letter-spacing: 1px; }

.dashboard-scroll { padding: 24px 28px 32px; }

/* ── SCENARIO LIST ── */
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.scenario-card {
  background: var(--navy-light); border: 1px solid var(--border-sub); border-radius: 10px;
  padding: 18px; cursor: pointer; transition: border-color 0.15s, transform 0.15s;
  display: flex; flex-direction: column; gap: 8px;
}
.scenario-card:hover { border-color: var(--gold); transform: translateY(-1px); }
.scenario-card-category { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); opacity: 0.85; }
.scenario-card-title { font-size: 16px; font-weight: 700; }
.scenario-card-desc { font-size: 13px; color: var(--grey-light); line-height: 1.5; }

/* ── BRIEFING ── */
.briefing-box { max-width: 640px; background: var(--navy-light); border: 1px solid var(--border-sub); border-radius: 12px; padding: 28px; }
.briefing-category { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.briefing-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; margin-bottom: 14px; }
.briefing-desc { font-size: 14px; line-height: 1.6; color: var(--grey-light); margin-bottom: 22px; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--orange); color: var(--white); font-weight: 700; font-size: 13px; letter-spacing: 0.3px; padding: 11px 22px; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.15s; }
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-secondary { background: transparent; color: var(--grey-light); border: 1px solid var(--border-sub); }
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

/* ── ROLEPLAY CHAT ── */
.chat-shell { display: flex; flex-direction: column; height: calc(100vh - 130px); max-width: 780px; }
.chat-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border-sub); margin-bottom: 16px; }
.chat-header-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
.messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.msg-row { display: flex; }
.msg-row.user { justify-content: flex-end; }
.msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
.msg-row.counterparty .msg-bubble { background: var(--navy-light); border: 1px solid var(--border-sub); border-bottom-left-radius: 2px; }
.msg-row.user .msg-bubble { background: var(--orange); color: var(--white); border-bottom-right-radius: 2px; }
.typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--grey-light); animation: blink 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

.chat-input-row { display: flex; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border-sub); margin-top: 12px; }
.chat-input {
  flex: 1; background: var(--navy-mid); border: 1px solid var(--border-sub); border-radius: 8px;
  padding: 12px 14px; color: var(--white); font-family: 'Inter', sans-serif; font-size: 14px; resize: none; max-height: 120px;
}
.chat-input:focus { outline: none; border-color: var(--gold); }
.chat-send-btn {
  background: var(--orange); color: var(--white); border: none; border-radius: 8px;
  padding: 0 20px; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
}
.chat-send-btn:hover { opacity: 0.88; }
.chat-send-btn:disabled { opacity: 0.4; cursor: default; }

/* ── MIC BUTTON (push-to-talk voice input) — mirrors aris-coach.html exactly ── */
.mic-btn {
  width: 44px; height: auto;
  border-radius: 8px;
  background: var(--navy-mid);
  border: 1px solid var(--border-sub);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
  color: var(--gold);
}
.mic-btn:hover { background: var(--gold-dim); border-color: var(--gold); }
.mic-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mic-btn.recording { background: var(--orange); border-color: var(--orange); color: white; animation: mic-pulse 1.2s ease-in-out infinite; }
.mic-btn.transcribing { background: var(--gold-dim); border-color: var(--gold); cursor: wait; }
.mic-btn:disabled { opacity: 0.5; cursor: not-allowed; }
@keyframes mic-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,43,0.5); } 50% { box-shadow: 0 0 0 6px rgba(255,107,43,0); } }

.voice-status { font-size: 12px; color: var(--grey); margin-top: 8px; min-height: 16px; }
.voice-status.recording-active { color: var(--orange); font-weight: 600; }

/* ── MUTE TOGGLE (Lab auto-plays Carol's voice by default — walkie-talkie feel — this opts out) ── */
.mute-toggle {
  background: transparent; border: 1px solid var(--border-sub); border-radius: 8px;
  color: var(--grey-light); font-size: 12px; padding: 7px 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: border-color 0.15s, color 0.15s;
}
.mute-toggle:hover { border-color: var(--gold); color: var(--gold); }
.mute-toggle.muted { color: var(--grey); }
.end-session-row { padding-top: 12px; text-align: right; }

/* ── DEBRIEF ── */
.debrief-box { max-width: 680px; }
.debrief-score-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.debrief-score { font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: var(--gold); line-height: 1; }
.debrief-score-label { font-size: 13px; color: var(--grey-light); }
.debrief-section { margin-bottom: 20px; }
.debrief-section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.debrief-section p { font-size: 14px; line-height: 1.6; color: var(--grey-light); }
.debrief-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.debrief-list li { font-size: 14px; line-height: 1.5; color: var(--grey-light); padding-left: 18px; position: relative; }
.debrief-list li::before { content: '—'; position: absolute; left: 0; color: var(--gold); }

.loading-msg { color: var(--grey); font-size: 13px; padding: 20px 0; }
</style>
<script src="https://static.memberstack.com/scripts/v1/memberstack.js" data-memberstack-app="app_cmr41qq5500q80tsx94pj61rc" defer></script>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-row">
      <div class="logo-words">
        <div class="wordmark">F<span>O</span>RGE</div>
      </div>
    </div>
    <a class="nav-item" href="dashboard.html"><span>🏠</span>Dashboard</a>
    <a class="nav-item" href="aris-coach.html"><span>⚡</span>ARIS AI Coach</a>

    <a class="nav-item" href="crm.html"><span>📋</span>Deal CRM</a>

  <main class="main">

<script>
let memberToken = null;
let currentMemberId = null;
let hasEmpireAccess = false;
const EMPIRE_PRICE_ID = 'prc_empire-plan--401c10a7h';
const EMPIRE_SCENARIO_TITLE = 'Pitching a Commercial Loan Officer on a 5+ Unit Acquisition';
// Real Estate Lab's two counterparty voices — chosen 9/1/2026 to replace
// every persona silently defaulting to ARIS's own voice (aris-voice.js
// falls back to ARIS when no voiceId is sent, and this page never sent
// one). Each scenario's counterparty_gender (from lab-scenarios.js) picks
// which of these two speaks it — see getVoiceIdForScenario() below.
const LAB_VOICE_MALE = 'Nhs7eitvQWFTQBsf0yiT';
const LAB_VOICE_FEMALE = '8Es4wFxsDlHBmFWAOWRS';
let allScenarios = [];
let currentScenario = null;
let conversationHistory = []; // [{role: 'user'|'assistant', content: string}] — sent to lab-stream.js
let isStreaming = false;

// ── VOICE STATE ──
// Auto-play is ON by default here (unlike ARIS Coach's manual click-to-play
// button) — a roleplay negotiation is meant to feel like an actual call,
// not a chat log with an optional play button. toggleMute() opts out.
let voiceMuted = false;
let mediaRecorder = null;
let recordedChunks = [];
let micStream = null;
let currentVoiceAudio = null;

function showView(name) {
  ['list', 'briefing', 'roleplay', 'debrief'].forEach(v => {
    document.getElementById('view-' + v).style.display = v === name ? 'block' : 'none';
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function waitForMemberstack(maxWaitMs = 6000, intervalMs = 100) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const check = () => {
      if (window.$memberstackDom && window.$memberstackDom.getCurrentMember) resolve();
      else if (Date.now() - start > maxWaitMs) reject(new Error('Memberstack failed to load'));
      else setTimeout(check, intervalMs);
    };
    check();
  });
}

async function initLabPage() {
  try {
    await waitForMemberstack();
    const memberstack = window.$memberstackDom;
    const { data: member } = await memberstack.getCurrentMember();
    if (!member) { window.location.href = 'login.html'; return; }

    const FOUNDING_MEMBER_PRICE_IDS = ['prc_497-97-3m13d01j8', 'prc_247-97-ne13e01d6', 'prc_997-97-5fmt0nr5', 'prc_-97-direct-ka9b0lq3'];
    const FORGE_ZERO_PLAN_ID = 'pln_forge-zero-psnx0aea'; // free plan — has no Stripe priceId, so it needs its own explicit allowed condition below
    const EMPIRE_PLAN_ID = 'pln_empire--871c00ah3';
    const FOUNDATION_EMPIRE_PLAN_ID = 'pln_foundation-empire-eh1bv0h3e';
    const FOUNDATION_PLAN_ID = 'pln_foundation--s11cv0hs9'; // NEW standalone Foundation-only plan — grants base access below but is deliberately NOT added to hasEmpireAccess
    const hasActiveMembership = (member.planConnections || []).some(
      pc => (FOUNDING_MEMBER_PRICE_IDS.includes(pc.payment?.priceId) || pc.planId === FORGE_ZERO_PLAN_ID || pc.planId === FOUNDATION_PLAN_ID) && (pc.status === 'ACTIVE' || pc.status === 'TRIALING')
    );
    if (!hasActiveMembership) { window.location.href = 'signup.html'; return; }
    hasEmpireAccess = (member.planConnections || []).some(pc =>
      (pc.status === 'ACTIVE' || pc.status === 'TRIALING') && (
        pc.planId === EMPIRE_PLAN_ID ||
        pc.planId === FOUNDATION_EMPIRE_PLAN_ID ||
        pc.planId === FORGE_ZERO_PLAN_ID ||
        FOUNDING_MEMBER_PRICE_IDS.includes(pc.payment?.priceId)
      )
    );

    currentMemberId = member.id;
    memberToken = await memberstack.getMemberCookie();
    await loadScenarios();
  } catch (err) {
    console.error('Lab page init failed:', err);
  }
}

async function loadScenarios() {
  const container = document.getElementById('scenario-list-container');
  try {
    const res = await fetch('/api/lab-scenarios?action=list', {
      headers: { Authorization: `Bearer ${memberToken}` },
    });
    if (!res.ok) throw new Error('Failed to load scenarios');
    const { scenarios } = await res.json();
    allScenarios = scenarios || [];
  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="loading-msg">Couldn\'t load scenarios — check your connection and refresh.</div>';
    return;
  }

  if (!allScenarios.length) {
    container.innerHTML = '<div class="loading-msg">No scenarios published yet — check back soon.</div>';
    return;
  }

  container.innerHTML = `
    <div class="scenario-grid">
      ${allScenarios.map(s => {
        const isLocked = !hasEmpireAccess && s.title === EMPIRE_SCENARIO_TITLE;
        const clickHandler = isLocked ? `showEmpireLockModal()` : `openBriefing('${s.id}')`;
        const lockedStyle = isLocked ? 'opacity:0.55;' : '';
        const lockBadge = isLocked ? `<div style="font-size:11px;color:var(--gold);margin-top:6px;">🔒 Empire required</div>` : '';
        return `
        <div class="scenario-card" style="${lockedStyle}" onclick="${clickHandler}">
          <div class="scenario-card-category">${escapeHtml(s.category || 'General')}</div>
          <div class="scenario-card-title">${escapeHtml(s.title)}</div>
          <div class="scenario-card-desc">${escapeHtml(s.description || '')}</div>
          ${lockBadge}
        </div>
      `;}).join('')}
    </div>
  `;
}

function showEmpireLockModal() {
  let modal = document.getElementById('empire-lock-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'empire-lock-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML = `
      <div style="background:var(--navy);border:1px solid var(--gold);border-radius:12px;padding:32px;max-width:400px;text-align:center;">
        <div style="font-size:28px;margin-bottom:8px;">🔒</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold);margin-bottom:10px;">Empire Content</div>
        <div style="font-size:13px;color:var(--grey-light);line-height:1.6;margin-bottom:22px;">This scenario is part of Empire — unlock it to access Commercial Deal Analyzer, Deal Network, and 9 Education categories, one-time $997.</div>
        <button onclick="handleUnlockEmpireLab()" id="empire-modal-unlock-btn" style="width:100%;background:var(--orange);border:none;color:white;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;padding:13px;border-radius:8px;cursor:pointer;margin-bottom:10px;">Unlock Empire →</button>
        <button onclick="document.getElementById('empire-lock-modal').style.display='none'" style="width:100%;background:transparent;border:1px solid var(--border-sub);color:var(--grey-light);font-size:12px;padding:10px;border-radius:8px;cursor:pointer;">Maybe later</button>
      </div>`;
    document.body.appendChild(modal);
  }
  modal.style.display = 'flex';
}

async function handleUnlockEmpireLab() {
  const btn = document.getElementById('empire-modal-unlock-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading checkout...'; }
  try {
    const memberstack = window.$memberstackDom;
    await memberstack.purchasePlansWithCheckout({ priceId: EMPIRE_PRICE_ID });
  } catch (err) {
    console.error('Empire checkout failed:', err);
    if (btn) { btn.disabled = false; btn.textContent = 'Unlock Empire →'; }
  }
}

function openBriefing(id) {
  const s = allScenarios.find(x => x.id === id);
  if (!s) return;
  if (!hasEmpireAccess && s.title === EMPIRE_SCENARIO_TITLE) {
    showEmpireLockModal();
    return;
  }
  currentScenario = s;
  document.getElementById('briefing-category').textContent = s.category || 'General';
  document.getElementById('briefing-title').textContent = s.title;
  document.getElementById('briefing-desc').textContent = s.description || '';
  showView('briefing');
}

function backToList() {
  // Clean up any in-progress recording or playback if the member exits
  // mid-conversation, rather than leaving a mic stream open in the
  // background.
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  if (currentVoiceAudio) { currentVoiceAudio.pause(); currentVoiceAudio = null; }

  currentScenario = null;
  conversationHistory = [];
  document.getElementById('messages').innerHTML = '';
  showView('list');
}

function startRoleplay() {
  if (!currentScenario) return;
  conversationHistory = [];
  document.getElementById('roleplay-title').textContent = currentScenario.title;
  document.getElementById('messages').innerHTML = '';
  showView('roleplay');
  document.getElementById('user-input').focus();
}

function handleInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = conversationHistory.map(m => `
    <div class="msg-row ${m.role === 'user' ? 'user' : 'counterparty'}">
      <div class="msg-bubble">${escapeHtml(m.content)}</div>
    </div>
  `).join('');
  el.scrollTop = el.scrollHeight;
}

function showTypingIndicator() {
  const el = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row counterparty';
  row.id = 'typing-indicator';
  row.innerHTML = `<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  el.appendChild(row);
  el.scrollTop = el.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || !currentScenario) return;

  conversationHistory.push({ role: 'user', content: text });
  renderMessages();
  input.value = '';
  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  showTypingIndicator();

  try {
    const res = await fetch('/api/lab-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scenarioId: currentScenario.id,
        messages: conversationHistory,
      }),
    });

    if (!res.ok || !res.body) {
      removeTypingIndicator();
      conversationHistory.push({ role: 'assistant', content: '(Something went wrong reaching the counterparty — try again.)' });
      renderMessages();
      return;
    }

    removeTypingIndicator();
    conversationHistory.push({ role: 'assistant', content: '' });
    renderMessages();

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep the last, possibly-incomplete line for the next chunk

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const dataStr = line.slice(6).trim();
        if (!dataStr || dataStr === '[DONE]') continue;
        try {
          const evt = JSON.parse(dataStr);
          if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
            conversationHistory[conversationHistory.length - 1].content += evt.delta.text;
            renderMessages();
          }
        } catch (e) {
          // Incomplete or non-JSON SSE line — ignore and continue.
        }
      }
    }
  } catch (err) {
    console.error('Roleplay streaming error:', err);
    removeTypingIndicator();
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('user-input').focus();

    // Auto-play the completed response as voice, unless muted. Runs after
    // the full stream has landed (not mid-stream) so ElevenLabs gets the
    // complete line, not a partial sentence.
    const lastMsg = conversationHistory[conversationHistory.length - 1];
    if (!voiceMuted && lastMsg && lastMsg.role === 'assistant' && lastMsg.content.trim()) {
      playCarolVoice(lastMsg.content);
    }
  }
}

// ── VOICE PLAYBACK (auto-play, walkie-talkie style) ──
// Picks the correct Lab counterparty voice from the scenario's
// counterparty_gender (returned by lab-scenarios.js). Falls back to
// aris-voice.js's own default (ARIS's voice) if gender is missing or
// unrecognized, rather than guessing — same safe-fallback pattern the
// backend already uses.
function getVoiceIdForScenario() {
  const gender = (currentScenario?.counterparty_gender || '').trim().toLowerCase();
  if (gender === 'male' || gender === 'm') return LAB_VOICE_MALE;
  if (gender === 'female' || gender === 'f') return LAB_VOICE_FEMALE;
  return null;
}

async function playCarolVoice(text) {
  if (currentVoiceAudio) {
    currentVoiceAudio.pause();
    currentVoiceAudio = null;
  }
  try {
    const res = await fetch('/api/aris-voice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voiceId: getVoiceIdForScenario() }),
    });
    if (!res.ok) throw new Error(`Voice request failed (${res.status})`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentVoiceAudio = audio;
    audio.addEventListener('ended', () => { URL.revokeObjectURL(url); if (currentVoiceAudio === audio) currentVoiceAudio = null; });
    audio.addEventListener('error', () => { URL.revokeObjectURL(url); if (currentVoiceAudio === audio) currentVoiceAudio = null; });
    await audio.play();
  } catch (err) {
    console.error('Voice playback failed:', err);
    // Fails silently in the UI — the text response is already visible in
    // the transcript, so a voice failure shouldn't block the conversation.
  }
}

function toggleMute() {
  voiceMuted = !voiceMuted;
  const btn = document.getElementById('mute-toggle');
  if (voiceMuted) {
    btn.classList.add('muted');
    btn.textContent = '🔇 Voice Off';
    if (currentVoiceAudio) { currentVoiceAudio.pause(); currentVoiceAudio = null; }
  } else {
    btn.classList.remove('muted');
    btn.textContent = '🔊 Voice On';
  }
}

// ── VOICE INPUT (push-to-talk mic → ElevenLabs Scribe → existing sendMessage()) ──
// Mirrors aris-coach.html's exact toggleVoiceInput()/mediaRecorder pattern.
// Click once to start recording, click again to stop; the transcribed text
// is fed into the same sendMessage() flow as if it had been typed.
const MIC_ICON = `<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>`;
const STOP_ICON = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;

function setMicState(state) {
  const btn = document.getElementById('mic-btn');
  const icon = document.getElementById('mic-icon');
  const status = document.getElementById('voice-status');
  btn.classList.remove('recording', 'transcribing');
  status.classList.remove('recording-active');
  btn.disabled = false;

  if (state === 'recording') {
    btn.classList.add('recording');
    btn.title = 'Click to stop and send';
    icon.innerHTML = STOP_ICON;
    status.classList.add('recording-active');
    status.textContent = '● Recording — click the mic again to stop and send';
  } else if (state === 'transcribing') {
    btn.classList.add('transcribing');
    btn.disabled = true;
    btn.title = 'Transcribing...';
    icon.innerHTML = MIC_ICON;
    status.classList.add('recording-active');
    status.textContent = '● Transcribing your message...';
  } else {
    btn.title = 'Speak your response';
    icon.innerHTML = MIC_ICON;
    status.textContent = '';
  }
}

async function toggleVoiceInput() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop(); // onstop handler below does the rest
    return;
  }

  // Stop any currently-playing Carol audio before recording — otherwise
  // the mic could pick up her own voice as background noise.
  if (currentVoiceAudio) { currentVoiceAudio.pause(); currentVoiceAudio = null; }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    console.error('Microphone access denied or unavailable:', err);
    document.getElementById('voice-status').textContent = "Couldn't access your microphone — check your browser's permission settings.";
    return;
  }

  micStream = stream;
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;

    if (!recordedChunks.length) { setMicState('idle'); return; }

    const mimeType = mediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(recordedChunks, { type: mimeType });
    recordedChunks = [];

    if (blob.size < 1000) {
      setMicState('idle');
      return;
    }

    setMicState('transcribing');
    try {
      const res = await fetch('/api/aris-transcribe', {
        method: 'POST',
        headers: { 'Content-Type': mimeType },
        body: blob,
      });
      if (!res.ok) throw new Error(`Transcription failed (${res.status})`);
      const { text } = await res.json();

      setMicState('idle');

      if (!text || !text.trim()) {
        document.getElementById('voice-status').textContent = "Didn't catch that — try speaking again, a little closer to the mic.";
        return;
      }

      document.getElementById('user-input').value = text.trim();
      await sendMessage();
    } catch (err) {
      console.error('Voice input failed:', err);
      setMicState('idle');
      document.getElementById('voice-status').textContent = 'Had trouble hearing that — check your connection and try again.';
    }
  };

  mediaRecorder.start();
  setMicState('recording');
}

async function endSession() {
  if (!currentScenario || !conversationHistory.length) {
    backToList();
    return;
  }
  if (!confirm('End this session and get your debrief? You won\'t be able to continue this conversation afterward.')) return;

  showView('debrief');
  document.getElementById('debrief-container').innerHTML = '<div class="loading-msg">ARIS is reviewing your session...</div>';

  try {
    const res = await fetch('/api/lab-debrief', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scenarioId: currentScenario.id,
        memberId: currentMemberId,
        transcript: conversationHistory,
      }),
    });
    const result = await res.json();
    if (!res.ok || !result.debrief) throw new Error(result.error || 'Debrief failed');
    renderDebrief(result.debrief);
  } catch (err) {
    console.error('Debrief error:', err);
    document.getElementById('debrief-container').innerHTML = '<div class="loading-msg">Couldn\'t generate your debrief — please try again.</div>';
  }
}

function renderDebrief(d) {
  const strengths = (d.strengths || []).map(s => `<li>${escapeHtml(s)}</li>`).join('');
  const improve = (d.areasToImprove || []).map(s => `<li>${escapeHtml(s)}</li>`).join('');

  document.getElementById('debrief-container').innerHTML = `
    <div class="debrief-score-row">
      <div class="debrief-score">${escapeHtml(String(d.score ?? '—'))}/10</div>
      <div class="debrief-score-label">${escapeHtml(currentScenario?.title || '')}</div>
    </div>
    <div class="debrief-section">
      <div class="debrief-section-title">Summary</div>
      <p>${escapeHtml(d.summary || '')}</p>
    </div>
    ${strengths ? `<div class="debrief-section"><div class="debrief-section-title">Strengths</div><ul class="debrief-list">${strengths}</ul></div>` : ''}
    ${improve ? `<div class="debrief-section"><div class="debrief-section-title">Areas to Improve</div><ul class="debrief-list">${improve}</ul></div>` : ''}
    ${d.keyMoment ? `<div class="debrief-section"><div class="debrief-section-title">Key Moment</div><p>${escapeHtml(d.keyMoment)}</p></div>` : ''}
  `;
}

initLabPage();
</script>
